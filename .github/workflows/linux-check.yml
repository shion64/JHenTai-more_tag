name: linux-check
on:
  push:
    branches:
      - 'ci-build'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: 'master'
          cache: true
      - name: Install build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libfuse2 libwebkit2gtk-4.1-dev
      - run: flutter pub get
      - name: Analyze
        continue-on-error: true
        run: flutter analyze
      - name: Test
        continue-on-error: true
        run: flutter test
      - name: Build Linux
        run: flutter build linux --release -t lib/src/main.dart
      - uses: actions/upload-artifact@v4
        with:
          name: jhentai-linux
          path: build/linux/x64/release/bundle
